<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXed9i1ju0Nr8DXqGJZ4WMW8dcnIMP4i8",
    authDomain: "gato-mobile.firebaseapp.com",
    projectId: "gato-mobile",
    storageBucket: "gato-mobile.firebasestorage.app",
    messagingSenderId: "831742761635",
    appId: "1:831742761635:web:229a96a262b5b3bd9a3d16"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window._allBlogDocs = [];

  window.loadBlogPosts = async function() {
    const container = document.getElementById('blog-list');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">불러오는 중...</div>';
    try {
      const q = query(collection(db, 'blog'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      window._allBlogDocs = snap.docs;
      renderBlogList(snap.docs);
    } catch(e) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">불러오기 실패</div>';
    }
  };

  window.renderBlogList = function(docs) {
    const container = document.getElementById('blog-list');
    if (!container) return;
    if (!docs || docs.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px;color:#9ca3af;font-size:15px;">📝 검색 결과가 없습니다.</div>';
      return;
    }
    const notices = docs.filter(d => d.data().isNotice);
    const normals = docs.filter(d => !d.data().isNotice);
    const sorted = [...notices, ...normals];
    container.innerHTML = sorted.map(d => {
      const data = d.data();
      const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('ko-KR') : '';
      const cleanContent = (data.content || '')
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
        .replace(/<[^>]*>/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      const preview = cleanContent ? cleanContent.substring(0, 100) + '...' : '';
      const isNotice = data.isNotice;
      return `<div onclick="openBlogPost('${d.id}')" style="background:#fff;border-radius:16px;padding:24px;border:1.5px solid ${isNotice?'#FF6B35':'#f0f0f0'};box-shadow:0 2px 12px rgba(0,0,0,.05);cursor:pointer;transition:all .2s;margin-bottom:16px;${isNotice?'background:linear-gradient(to right,#fff8f6,#fff);':''}" onmouseover="this.style.boxShadow='0 8px 24px rgba(77,189,232,.15)'" onmouseout="this.style.boxShadow='0 2px 12px rgba(0,0,0,.05)'">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
          ${isNotice ? '<span style="background:#FF6B35;color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:100px;">📌 공지</span>' : '<span style="width:1px;"></span>'}
          <span style="font-size:13px;color:#9ca3af;">${date}</span>
        </div>
        <h2 style="font-size:18px;font-weight:800;color:#1a1a1a;margin-bottom:8px;letter-spacing:-.3px;">${data.title||''}</h2>
        <p style="font-size:14px;color:#6b7280;line-height:1.6;">${preview}</p>
      </div>`;
    }).join('');
  };

  window.searchBlog = function() {
    const kw = (document.getElementById('blog-search-input').value || '').trim().toLowerCase();
    if (!kw) { renderBlogList(window._allBlogDocs); return; }
    const filtered = window._allBlogDocs.filter(d => {
      const data = d.data();
      return (data.title||'').toLowerCase().includes(kw) || (data.content||'').replace(/<[^>]*>/g,'').toLowerCase().includes(kw);
    });
    renderBlogList(filtered);
  };

  window.openBlogPost = async function(id) {
    try {
      const snap = await getDocs(collection(db, 'blog'));
      const docData = snap.docs.find(d => d.id === id);
      if (!docData) return;
      const data = docData.data();
      try { history.pushState({postId: id}, '', '/blog?post=' + id); } catch(e) {}
      document.getElementById('blog-list-wrap').style.display = 'none';
      const detail = document.getElementById('blog-detail');
      detail.style.display = 'block';

      let rawContent = data.content || '';
      let bodyContent = rawContent;
      let extractedStyles = '';

      const isFullDoc = rawContent.trim().toLowerCase().startsWith('<!doctype') || rawContent.trim().toLowerCase().startsWith('<html');
      if (isFullDoc) {
        const styleMatches = rawContent.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
        extractedStyles = styleMatches.map(s => s.replace(/<\/?style[^>]*>/gi, '')).join('\n');
        const bodyMatch = rawContent.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        bodyContent = bodyMatch ? bodyMatch[1] : rawContent;
        bodyContent = bodyContent.replace(/<script[\s\S]*?<\/script>/gi, '');
      }

      const oldStyle = document.getElementById('blog-injected-style');
      if (oldStyle) oldStyle.remove();

      detail.innerHTML = `
        <div style="padding:20px 24px 0;max-width:780px;margin:0 auto;">
          <button onclick="closeBlogPost()" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:#4DBDE8;font-weight:700;font-size:14px;cursor:pointer;">← 목록으로</button>
        </div>
        <div id="blog-shadow-host" style="width:100%;display:block;"></div>`;

      const shadowHost = document.getElementById('blog-shadow-host');
      const shadowRoot = shadowHost.attachShadow({ mode: 'open' });
      shadowRoot.innerHTML = `<style>${extractedStyles}</style><div style="padding-bottom:60px;">${bodyContent}</div>`;
    } catch(e) {}
  };

  window.closeBlogPost = function() {
    try { history.pushState({}, '', '/blog'); } catch(e) {}
    const injectedStyle = document.getElementById('blog-injected-style');
    if (injectedStyle) injectedStyle.remove();
    document.getElementById('blog-list-wrap').style.display = 'block';
    document.getElementById('blog-detail').style.display = 'none';
  };

  // 뒤로가기 처리
  window.addEventListener('popstate', function(e) {
    if (e.state && e.state.postId) {
      openBlogPost(e.state.postId);
    } else {
      const injectedStyle = document.getElementById('blog-injected-style');
      if (injectedStyle) injectedStyle.remove();
      document.getElementById('blog-list-wrap').style.display = 'block';
      document.getElementById('blog-detail').style.display = 'none';
    }
  });

  // ?post= 파라미터로 직접 접근 시 글 열기
  window.addEventListener('load', async function() {
    await loadBlogPosts();
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('post');
    if (postId) {
      setTimeout(() => openBlogPost(postId), 300);
    }
  });
</script>
</body>
</html>
